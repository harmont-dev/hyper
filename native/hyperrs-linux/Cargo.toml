[package]
name = "hyperrs-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints.clippy]
redundant_field_names = "allow"

[dependencies]
derive_more = { version = "2.1.1", features = ["as_ref", "display", "constructor", "from", "into", "try_unwrap"] }
hyperrs-fs = { path = "../hyperrs-fs" }
hyperrs-process = { path = "../hyperrs-process" }
netlink-packet-core = "0.9"
netlink-packet-route = "0.34"
netlink-sys = "0.9"
nix = { version = "0.29", features = ["fs", "ioctl", "mount", "poll", "sched", "user"] }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", optional = true }
smart-default = "0.7.1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "1"

[features]
serde = ["dep:serde_with", "hyperrs-fs/serde"]

[dev-dependencies]
assert_fs = "1"
pretty_assertions = "1"
proptest = "1"
rstest = "0.28"
test-strategy = "0.4"
