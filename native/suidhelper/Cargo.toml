[package]
name = "hyper-suidhelper"
version = "0.1.0"
edition = "2021"
description = "Tiny setuid-root helper that runs a whitelisted set of device commands for the unprivileged Hyper node."
license = "MIT"
repository = "https://github.com/harmont-dev/hyper"

[features]
# TEST ONLY. Compiles the insecure_mode insecure arms. Never enable for a real
# (setuid) build — build.rs refuses to compile a release binary with this on.
insecure_mode = []

[[bin]]
name = "hyper-suidhelper"
path = "src/main.rs"

[[bin]]
name = "fake-jailer"
path = "tests/e2e/fake_jailer.rs"
required-features = ["insecure_mode"]

# Integration tests mirror the `src/` module tree under `tests/`. Cargo only
# auto-discovers test files at the top level of `tests/`, so each nested file
# needs an explicit target pointing at its path.
[[test]]
name = "config_seam"
path = "tests/config_seam.rs"

[[test]]
name = "caller_authorize"
path = "tests/caller_authorize.rs"

[[test]]
name = "cli_request"
path = "tests/cli_request.rs"

[[test]]
name = "request_wire_properties"
path = "tests/request_wire_properties.rs"

[[test]]
name = "e2e_config"
path = "tests/e2e/config.rs"

[[test]]
name = "e2e_firewall"
path = "tests/e2e/firewall.rs"

[[test]]
name = "e2e_vm_net"
path = "tests/e2e/vm_net.rs"

[[test]]
name = "e2e_vm_net_traffic"
path = "tests/e2e/vm_net_traffic.rs"

[[test]]
name = "e2e_caller_gate"
path = "tests/e2e/caller_gate.rs"

[[test]]
name = "e2e_argv"
path = "tests/e2e/argv.rs"

[[test]]
name = "e2e_jailer"
path = "tests/e2e/jailer.rs"

[[test]]
name = "e2e_chroot_jail"
path = "tests/e2e/chroot_jail.rs"

[[test]]
name = "e2e_socket_pin"
path = "tests/e2e/socket_pin.rs"

[[test]]
name = "e2e_lock_dir_hostile"
path = "tests/e2e/lock_dir_hostile.rs"

[[test]]
name = "e2e_claim_privacy"
path = "tests/e2e/claim_privacy.rs"

[[test]]
name = "e2e_version"
path = "tests/e2e/version.rs"

[[test]]
name = "e2e_thin"
path = "tests/e2e/thin.rs"

[[test]]
name = "e2e_fork_delta"
path = "tests/e2e/fork_delta.rs"

[[test]]
name = "e2e_fork_delta_live"
path = "tests/e2e/fork_delta_live.rs"

[[test]]
name = "e2e_img"
path = "tests/e2e/img.rs"

[[test]]
name = "config_uid_gid_range"
path = "tests/config_uid_gid_range.rs"

[[test]]
name = "config_paths"
path = "tests/config_paths.rs"

[[test]]
name = "net_addressing"
path = "tests/net_addressing.rs"

[[test]]
name = "dm_backing"
path = "tests/dm/backing.rs"

[lints.clippy]
redundant_field_names = "allow"

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "as_ref", "constructor", "deref", "from", "into", "add", "debug"] }
enum_dispatch = "0.3"
hyperrs-elfsum = { path = "../hyperrs-elfsum" }
hyperrs-firecracker = { path = "../hyperrs-firecracker", features = ["serde"] }
hyperrs-fs = { path = "../hyperrs-fs", features = ["serde"] }
hyperrs-linux = { path = "../hyperrs-linux", features = ["serde"] }
hyperrs-process = { path = "../hyperrs-process" }
nix = { version = "0.29", features = ["user", "fs", "dir", "process", "ioctl", "poll"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
smart-default = "0.7.1"
thiserror = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1"
predicates = "3.1.4"
pretty_assertions = "1"
proptest = "1"
rstest = "0.28"
socket2 = { version = "0.6", features = ["all"] }
test-strategy = "0.4"
