[workspace]
members = ["meta", "xtask"]
# Plain `cargo build`/`cargo test` only touch the helper itself; xtask is a
# build tool, built on demand via the `cargo xtask` alias.
default-members = ["."]

[package]
name = "hyper-suidhelper"
version = "0.1.0"
edition = "2021"
description = "Tiny setuid-root helper that runs a whitelisted set of device commands for the unprivileged Hyper node."
license = "MIT"
repository = "https://github.com/harmont-dev/hyper"

[features]
# TEST ONLY. Compiles the security_gate insecure arms. Never enable for a real
# (setuid) build — build.rs refuses to compile a release binary with this on.
insecure_test_seams = []

[[bin]]
name = "hyper-suidhelper"
path = "src/main.rs"

# Integration tests mirror the `src/` module tree under `tests/`. Cargo only
# auto-discovers test files at the top level of `tests/`, so each nested file
# needs an explicit target pointing at its path.
[[test]]
name = "safe_path"
path = "tests/util/safe_path.rs"

[[test]]
name = "safe_dev"
path = "tests/util/safe_dev.rs"

[[test]]
name = "security_gate"
path = "tests/security_gate.rs"

[[test]]
name = "config_seam"
path = "tests/config_seam.rs"

[[test]]
name = "util_safe_bin"
path = "tests/util/safe_bin.rs"

[[test]]
name = "tools_dmsetup_parsers"
path = "tests/tools/dmsetup_parsers.rs"

[[test]]
name = "tools_dmsetup_command"
path = "tests/tools/dmsetup_command.rs"

[[test]]
name = "tools_blockcopy"
path = "tests/tools/blockcopy.rs"

[[test]]
name = "tools_jailer"
path = "tests/tools/jailer.rs"

[[test]]
name = "tools_network_addr"
path = "tests/tools/network_addr.rs"

[[test]]
name = "tools_network_args"
path = "tests/tools/network_args.rs"

[[test]]
name = "tools_host_init"
path = "tests/tools/host_init.rs"

[[test]]
name = "util_confinement"
path = "tests/util/confinement.rs"

[[test]]
name = "tools_chroot_jail_remove"
path = "tests/tools/chroot_jail_remove.rs"

[[test]]
name = "tools_chroot_jail_grant_api"
path = "tests/tools/chroot_jail_grant_api.rs"

[[test]]
name = "tools_chroot_jail_grant_vsock"
path = "tests/tools/chroot_jail_grant_vsock.rs"

[[test]]
name = "util_chroot_jail"
path = "tests/util/chroot_jail.rs"

[[test]]
name = "e2e_config"
path = "tests/e2e/config.rs"

[[test]]
name = "e2e_argv"
path = "tests/e2e/argv.rs"

[[test]]
name = "e2e_jailer"
path = "tests/e2e/jailer.rs"

[[test]]
name = "e2e_chroot_jail"
path = "tests/e2e/chroot_jail.rs"

[[test]]
name = "e2e_version"
path = "tests/e2e/version.rs"

[[test]]
name = "e2e_losetup"
path = "tests/e2e/losetup.rs"

[[test]]
name = "e2e_thin_dump"
path = "tests/e2e/thin_dump.rs"

[[test]]
name = "config_uid_gid_range"
path = "tests/config_uid_gid_range.rs"

[[test]]
name = "config_network"
path = "tests/config_network.rs"

[[test]]
name = "util_linux_thin_dump"
path = "tests/util/linux/thin_dump.rs"

[[test]]
name = "tools_losetup_backing"
path = "tests/tools/losetup_backing.rs"

[dependencies]
bon = "3.9.3"
clap = { version = "4", features = ["derive"] }
hyper-suidhelper-meta = { path = "meta" }
nix = { version = "0.29", features = ["user", "fs", "dir", "process"] }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
