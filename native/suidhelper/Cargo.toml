[package]
name = "hyper-suidhelper"
version = "0.1.0"
edition = "2021"
description = "Tiny setuid-root helper that runs a whitelisted set of device commands for the unprivileged Hyper node."
license = "MIT"
repository = "https://github.com/harmont-dev/hyper"

[features]
# TEST ONLY. Compiles the insecure_mode insecure arms. Never enable for a real
# (setuid) build — build.rs refuses to compile a release binary with this on.
insecure_mode = []

[[bin]]
name = "hyper-suidhelper"
path = "src/main.rs"

[[bin]]
name = "fake-jailer"
path = "tests/e2e/fake_jailer.rs"
required-features = ["insecure_mode"]

# Integration tests mirror the `src/` module tree under `tests/`. Cargo only
# auto-discovers test files at the top level of `tests/`, so each nested file
# needs an explicit target pointing at its path.
[[test]]
name = "config_seam"
path = "tests/config_seam.rs"

[[test]]
name = "network_addr"
path = "tests/network/addr.rs"

[[test]]
name = "network_args"
path = "tests/network/args.rs"

[[test]]
name = "network_host_init"
path = "tests/network/host_init.rs"

[[test]]
name = "e2e_config"
path = "tests/e2e/config.rs"

[[test]]
name = "e2e_argv"
path = "tests/e2e/argv.rs"

[[test]]
name = "e2e_jailer"
path = "tests/e2e/jailer.rs"

[[test]]
name = "e2e_chroot_jail"
path = "tests/e2e/chroot_jail.rs"

[[test]]
name = "e2e_version"
path = "tests/e2e/version.rs"

[[test]]
name = "e2e_thin_copy"
path = "tests/e2e/thin_copy.rs"

[[test]]
name = "config_uid_gid_range"
path = "tests/config_uid_gid_range.rs"

[[test]]
name = "config_network"
path = "tests/config_network.rs"

[[test]]
name = "config_paths"
path = "tests/config_paths.rs"

[[test]]
name = "dm_backing"
path = "tests/dm/backing.rs"

[lints.clippy]
redundant_field_names = "allow"

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "as_ref", "constructor", "deref", "from", "into", "add", "debug"] }
enum_dispatch = "0.3"
hyperrs-elfsum = { path = "../hyperrs-elfsum" }
hyperrs-firecracker = { path = "../hyperrs-firecracker" }
hyperrs-fs = { path = "../hyperrs-fs" }
hyperrs-linux = { path = "../hyperrs-linux" }
hyperrs-process = { path = "../hyperrs-process" }
nix = { version = "0.29", features = ["user", "fs", "dir", "process", "ioctl", "poll"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
smart-default = "0.7.1"
thiserror = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1"
predicates = "3.1.4"
pretty_assertions = "1"
proptest = "1"
rstest = "0.28"
test-strategy = "0.4"
