[package]
name = "hyperrs-elfsum"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
stamp = ["dep:blake3", "dep:object", "dep:thiserror"]

[dependencies]
blake3 = { version = "1", optional = true }
object = { version = "0.36", optional = true }
thiserror = { version = "1", optional = true }

[dev-dependencies]
blake3 = "1"
object = { version = "0.36", features = ["write"] }
proptest = "1"
