[package]
name = "hyperrs-firecracker"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints.clippy]
redundant_field_names = "allow"

[dependencies]
bon = "3.9.3"
derive_more = { version = "2.1.1", features = ["display"] }
hyperrs-fs = { path = "../hyperrs-fs" }
hyperrs-process = { path = "../hyperrs-process" }
nix = { version = "0.29", features = ["user", "fs"] }
thiserror = "1"

[dev-dependencies]
proptest = "1"
rstest = "0.28"
tempfile = "3"
