[package]
name = "hyperrs-firecracker"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints.clippy]
redundant_field_names = "allow"

[dependencies]
bon = "3.9.3"
derive_more = { version = "2.1.1", features = ["display"] }
hyperrs-fs = { path = "../hyperrs-fs" }
hyperrs-process = { path = "../hyperrs-process" }
nix = { version = "0.29", features = ["user", "fs"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_with = { version = "3", optional = true }
thiserror = "1"

[features]
serde = ["dep:serde", "dep:serde_with", "hyperrs-fs/serde"]

[dev-dependencies]
assert_fs = "1"
predicates = "3"
pretty_assertions = "1"
proptest = "1"
rstest = "0.28"
test-strategy = "0.4"
