[package]
name = "hyperrs-fs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints.clippy]
redundant_field_names = "allow"

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "as_ref", "constructor", "into", "add", "debug"] }
nix = { version = "0.29", features = ["user", "fs", "dir", "ioctl"] }
ref-cast = "1.0.25"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "1"

[features]
serde = ["dep:serde"]

[dev-dependencies]
assert_fs = "1"
predicates = "3"
pretty_assertions = "1"
proptest = "1"
rstest = "0.28"
test-strategy = "0.4"
