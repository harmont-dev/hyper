[package]
name = "hyper-guest-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "hyper_guest_agent"
path = "src/lib.rs"

[[bin]]
name = "hyper-guest-agent"
path = "src/main.rs"

[dependencies]
nix = { version = "0.29", features = ["mount"] }
pid1 = "0.1.6"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process"] }
tokio-vsock = { version = "0.7", features = ["tonic014"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
proptest = "1"
tokio-stream = "0.1"

[[test]]
name = "exec"
path = "tests/exec.rs"

[[test]]
name = "init"
path = "tests/init.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
