// Hyper -- public gRPC interface to a Hyper cluster.
//
// Hyper is a distributed orchestrator for Firecracker microVMs. This file is
// the language-agnostic contract for driving it: creating, stopping, locating,
// and listing microVMs ("VMs") from any gRPC client.
//
// A VM is addressed by its `vm_id` -- a URL-safe base64 string the server mints
// at creation. Placement across the cluster is automatic; the server is
// stateless and identical on every node, so any node can serve any request.
syntax = "proto3";

package hyper.grpc.v1;

// The VM lifecycle service.
//
// Errors are returned as standard gRPC statuses (see each RPC). Beyond the ones
// listed, any RPC may return INTERNAL for an unexpected server-side failure.
service Hyper {
  // Create and boot a microVM from an image.
  //
  // The image is scheduled onto the most available node in the cluster
  // (preferring nodes that already hold the image's layers); a per-VM writable
  // root filesystem is built over it and the guest is booted. Returns the
  // minted `vm_id` and the node the guest booted on.
  //
  // Errors:
  //   INVALID_ARGUMENT  -- `img_id` is empty, or an enum field holds an
  //                       unrecognised value.
  //   RESOURCE_EXHAUSTED -- no node in the cluster has spare capacity.
  //   UNAVAILABLE       -- the VM was placed but its host became unreachable
  //                       before its id could be confirmed.
  rpc CreateVm(CreateVmRequest) returns (CreateVmResponse);

  // Fork a running microVM: snapshot its disk and boot a colocated child from
  // the copy-on-write clone, falling back to a cluster-wide placement (via a
  // published delta layer) when the parent's node is full. The parent keeps
  // running. The fork is crash-consistent (like a power cut) after a best-effort
  // guest sync. Returns the new child's `vm_id` and the node it booted on.
  //
  // Errors:
  //   NOT_FOUND          -- no VM with this `vm_id` is running in the cluster.
  //   RESOURCE_EXHAUSTED -- no node in the cluster can admit the child.
  //   UNAVAILABLE        -- the parent's host node became unreachable.
  rpc ForkVm(ForkVmRequest) returns (ForkVmResponse);

  // Stop and tear down a running microVM. Idempotent in effect: tearing down a
  // VM that is already stopping is not an error.
  //
  // Errors:
  //   NOT_FOUND   -- no VM with this `vm_id` is running in the cluster.
  //   UNAVAILABLE -- the VM's host node is unreachable.
  rpc StopVm(StopVmRequest) returns (StopVmResponse);

  // Locate a microVM: report the cluster node it currently runs on.
  //
  // Errors:
  //   NOT_FOUND -- no VM with this `vm_id` is known to the cluster.
  rpc GetVm(GetVmRequest) returns (GetVmResponse);

  // Report a microVM's metered compute: the cumulative CPU time it has
  // actually executed, measured from its cgroup. An idle VM accrues (almost)
  // none -- this is compute performed, not compute allocated. Works for
  // stopped VMs too, reporting the recorded lifetime total.
  //
  // Errors:
  //   NOT_FOUND -- no VM with this `vm_id` is running and none was ever metered.
  rpc GetVmUsage(GetVmUsageRequest) returns (GetVmUsageResponse);

  // List every microVM currently known to the cluster, across all nodes.
  rpc ListVms(ListVmsRequest) returns (ListVmsResponse);

  // Report a running VM's host-routable veth-namespace IP -- the address on the
  // host's network-namespace side that DNATs into the guest. This is what a
  // control plane dials to reach the guest.
  //
  // Errors:
  //   NOT_FOUND -- no VM with this `vm_id` is running in the cluster.
  rpc GetVmAddress(GetVmAddressRequest) returns (GetVmAddressResponse);

  // Report the host's own address on the VM's veth -- the peer of the address
  // `GetVmAddress` returns, and what a guest-local service dials to reach the
  // host. Only ports named in the node's `host_ports` are reachable there.
  //
  // Errors:
  //   NOT_FOUND -- no VM with this `vm_id` is running in the cluster.
  rpc GetHostAddress(GetHostAddressRequest) returns (GetHostAddressResponse);

  // Report the endpoint that speaks to a VM's Docker daemon. Today a host-local
  // Unix socket path relayed over vsock to the guest daemon; a later revision
  // returns a network (`tcp://`) endpoint so a remote control plane can drive it.
  //
  // Errors:
  //   NOT_FOUND -- no VM with this `vm_id` is running in the cluster.
  rpc GetDockerEndpoint(GetDockerEndpointRequest) returns (GetDockerEndpointResponse);

  // Load an OCI image into the cluster's shared media store and image database.
  //
  // Pulls the referenced image for this node's architecture, flattens it, builds
  // an ext4 rootfs, content-addresses it, and records a base image. Runs on the
  // node that receives the call; the result is visible cluster-wide. Blocks until
  // the load completes -- this can take minutes -- so set a generous deadline.
  // Returns the content-addressed `img_id` to pass to CreateVm.
  //
  // Errors:
  //   INVALID_ARGUMENT    -- `image_ref` is empty or malformed.
  //   FAILED_PRECONDITION -- the node lacks the required tools (skopeo/umoci/mke2fs).
  //   INTERNAL            -- the pull, unpack, build, publish, or DB record failed.
  rpc LoadImage(LoadImageRequest) returns (LoadImageResponse);
}

// A fixed (vCPU, memory, disk) size, like a cloud instance class. Each step up
// is roughly a doubling. The vCPU/memory annotations below are the headline
// figures; disk and bandwidth scale alongside them.
enum InstanceType {
  INSTANCE_TYPE_UNSPECIFIED = 0;  // unset -- the server rejects it (INVALID_ARGUMENT)
  INSTANCE_TYPE_MICRO = 1;   // 0.25 vCPU, 128 MiB
  INSTANCE_TYPE_MILLI = 2;   // 0.5 vCPU,  256 MiB
  INSTANCE_TYPE_CENTI = 3;   // 1 vCPU,    512 MiB
  INSTANCE_TYPE_DECI = 4;    // 2 vCPU,    1 GiB
  INSTANCE_TYPE_BASE = 5;    // 4 vCPU,    2 GiB
  INSTANCE_TYPE_DECA = 6;    // 8 vCPU,    4 GiB
  INSTANCE_TYPE_HECTO = 7;   // 16 vCPU,   8 GiB
  INSTANCE_TYPE_KILO = 8;    // 32 vCPU,   16 GiB
  INSTANCE_TYPE_MEGA = 9;    // 64 vCPU,   32 GiB
  INSTANCE_TYPE_GIGA = 10;   // 128 vCPU,  64 GiB
  INSTANCE_TYPE_TERA = 11;   // 256 vCPU,  128 GiB
  INSTANCE_TYPE_TALL = 12;   // 3 vCPU,    4 GiB (memory-optimized)
  INSTANCE_TYPE_BUILDER = 13; // 3 vCPU,    8 GiB (build-optimized)
}

// Guest CPU architecture. Must match the architecture the image was built for.
enum Architecture {
  ARCHITECTURE_UNSPECIFIED = 0;  // unset -- the server rejects it (INVALID_ARGUMENT)
  ARCHITECTURE_X86_64 = 1;       // x86-64 / amd64
  ARCHITECTURE_AARCH64 = 2;      // arm64
}

// Request to create and boot a VM.
//
// `instance_type` and `arch` are required. Their proto3 zero value is the
// `*_UNSPECIFIED` sentinel, which the server rejects with INVALID_ARGUMENT --
// an omitted field is an error, never a silent default. Set them explicitly.
message CreateVmRequest {
  // Required. The content-addressed id of the image to boot.
  string img_id = 1;

  // Required. The instance size to allocate.
  InstanceType instance_type = 2;

  // Required. The guest CPU architecture; must match the image.
  Architecture arch = 3;

  // Optional. Extra kernel command-line arguments. If unset, the server's
  // standard serial-console cmdline is used.
  optional string boot_args = 4;
}

// Result of a successful CreateVm.
message CreateVmResponse {
  // The server-minted id for the new VM; use it in all later RPCs.
  string vm_id = 1;

  // The cluster node (Erlang node name) the guest booted on.
  string node = 2;
}

// Request to fork a running VM.
message ForkVmRequest {
  // The id of the parent VM to fork.
  string vm_id = 1;
}

// Result of a successful ForkVm.
message ForkVmResponse {
  // The server-minted id for the new child VM; use it in all later RPCs.
  string vm_id = 1;

  // The cluster node (Erlang node name) the child booted on.
  string node = 2;
}

// Request to stop a VM.
message StopVmRequest {
  // The id of the VM to tear down.
  string vm_id = 1;
}

// Result of StopVm. Empty today.
message StopVmResponse {}

// Request to locate a VM.
message GetVmRequest {
  // The id of the VM to look up.
  string vm_id = 1;
}

// Result of a successful GetVm.
message GetVmResponse {
  // Echoes the requested id.
  string vm_id = 1;

  // The cluster node (Erlang node name) the VM currently runs on.
  string node = 2;
}

// Request a VM's metered compute.
message GetVmUsageRequest {
  // The id of the VM to report on.
  string vm_id = 1;
}

// Result of a successful GetVmUsage.
message GetVmUsageResponse {
  // Echoes the requested id.
  string vm_id = 1;

  // Cumulative CPU time the VM has actually executed, in microseconds.
  uint64 cpu_usec = 2;
}

// Request to list VMs. All fields are optional; an empty request lists from the
// beginning with a server-default page size.
message ListVmsRequest {
  // Optional. Maximum VMs to return in one page. 0 or unset selects a server
  // default (100); values above the server maximum (1000) are capped down.
  int32 page_size = 1;

  // Optional. An opaque cursor taken verbatim from a previous response's
  // `next_page_token`. Empty or unset starts from the beginning.
  string page_token = 2;
}

// Result of ListVms.
message ListVmsResponse {
  // A page of VMs, ordered by `vm_id`.
  repeated Vm vms = 1;

  // Opaque cursor for the next page. `""` when this is the last page.
  string next_page_token = 2;
}

// A VM and where it runs. Returned by ListVms.
message Vm {
  // The VM's id.
  string vm_id = 1;

  // The cluster node (Erlang node name) the VM runs on.
  string node = 2;
}

// Request to load an OCI image.
message LoadImageRequest {
  // Required. An OCI image reference, e.g. "docker.io/library/alpine:3.19".
  string image_ref = 1;

  // Optional. A human-readable label stored with the image (defaults to image_ref).
  optional string label = 2;
}

// Result of a successful LoadImage.
message LoadImageResponse {
  // The content-addressed image id; pass it to CreateVm.
  string img_id = 1;
}

// Request a VM's host-routable veth-namespace IP.
message GetVmAddressRequest {
  // The id of the VM to address.
  string vm_id = 1;
}

// Result of a successful GetVmAddress.
message GetVmAddressResponse {
  // The dotted-quad IP that DNATs into the guest.
  string address = 1;
}

// Request the host's own address on a VM's veth.
message GetHostAddressRequest {
  // The id of the VM whose host-side peer address to report.
  string vm_id = 1;
}

// Result of a successful GetHostAddress.
message GetHostAddressResponse {
  // The dotted-quad IP a guest-local service dials to reach the host.
  string address = 1;
}

// Request the endpoint for a VM's Docker daemon.
message GetDockerEndpointRequest {
  // The id of the VM whose Docker endpoint to report.
  string vm_id = 1;
}

// Result of a successful GetDockerEndpoint.
message GetDockerEndpointResponse {
  // The endpoint that speaks to the VM's Docker daemon. A Unix socket path
  // today; a `tcp://host:port` URL once the daemon is exposed on the network.
  string endpoint = 1;
}
